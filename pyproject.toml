[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gap"
dynamic = ["version", "dependencies"]
authors = [
    { name = "k8thekat", email = "Cadwalladerkatelynn@gmail.com" },
]
readme = { file = "README.md", content-type = "text/markdown" }
description = "A Python wrapper for the Google API."
requires-python = ">=3.12.0"
license = { file = "LICENSE" }
# PyPi Classifiers.
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["google", "api", "calendar", "gmail", "keep"]

[project.urls]
GitHub = "https://github.com/k8thekat/GoogleAPI-python"
Issues = "https://github.com/k8thekat/GoogleAPI-python/issues"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }
version = { attr = "gap.__version__" }

[tool.setuptools]
packages = ["gap"]
include-package-data = true

[tool.setuptools.package-data]
gap = ["py.typed", "numpy_templates/*.mustache"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
exclude = ["docs/extensions/*.py", "logs"]
select = ["ALL"]
ignore = [
    "ANN401",
    "ASYNC240", # Because Umbra said "f anyio~"
    "C901", # Too complex functions.
    "COM812", # Trailing comma rule that fights the formatter.
    "CPY001", # We carry the GPL header, not a one line copyright notice.
    "D105", # Magic methods (`__repr__` etc) do not need their own docstring.
    "D107", # `__init__` params are documented on the class docstring instead.
    "D203", # Incompatible with D211, which we keep.
    "D213", # Incompatible with D212, which we keep.
    "D409", # Our numpy template uses longer section underlines on purpose.
    "EM101", # We want the message inline at the `raise`, not hoisted to a variable.
    "EM102", # Same as EM101 but for f-strings.
    "PGH004", # `# ruff: noqa` in `__init__.py` is deliberate.
    "S105", # False positives on our `*_token.json` filename constants.
    "TRY003", # Long messages at the `raise` site are exactly what we want.
    "D401", # Ignore "Imperative Mood" statement for docstrings.
    "ERA001", # Ignore commented out code.
    "FBT001", # Ignore "bool" type arguments and limited functionality statement.
    "FBT002", # Ignore "bool" type arguments and limited functionality statement.
    "FIX002", # Ignore TODO's telling you to "fix them".
    "F401",
    "F402",
    "F403",
    "F405",
    "PERF203",
    "PLR",
    "RUF001",
    "RUF002", # The character U+2013 "–" could be confused with the ASCII character U+002d "-", which is more common in source code.
    "RUF003", # Same as RUF002 but for "COMMENTS".
    "RUF009",
    "RUF052", # for filtering "local dummy variable is accessed" eg. - vars using `_`
    "SIM105",
    "SLF001", # private function/attribute usage outside of the class it was defined.
    "TD002", # Ignore TODO's not having a link/url to an issue.
    "TD003", # Ignore TODO's not having a link/url to an issue.
    "TRY400", # Ignoring forced `logging.exception` statements when using try/except.
    "T201", # Ignore print statements.
    "UP007",
    "UP034",
    "UP045", # Type var `Optional[X]` vs `X | None`
    # --- GAP specific ---------------------------------------------------
    # Google's API fields are camelCase; our models mirror them 1:1 so a
    # response can be splatted straight onto the class.
    "N802",
    "N803",
    "N815",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
combine-as-imports = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["gap"]
exclude = ["logs/**", "**/.venv/**", "**/node_modules", "**/__pycache__", "**/.*", "build/**"]
useLibraryCodeForTypes = true
reportIncompatibleMethodOverride = false
# `googleapiclient` ships no type information — `Resource` is built dynamically at
# runtime and `HttpRequest.execute()` returns Unknown. Under strict that floods every
# call site with noise we cannot fix from here, so the Unknown-* reports are off.
# Everything WE write is still fully checked.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
