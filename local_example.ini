; Template for local.ini — copy this to local.ini and fill in your own values.
; local.ini is gitignored; this file is not, so never put real IDs here.
;
; The structure here is what `gap` itself reads: `ini_load()` takes the [GAP]
; section and `ini_load_calendars()` takes [GAP.Calendars] as a name = id map.

[GAP]
; Where the client secret and cached *_token.json files live.
; Relative paths are resolved against this file's directory, so `.` is the repo root.
TOKEN_PATH = .

[GAP.Calendars]
; Names are case sensitive as written, but `resolve_calendar()` matches
; case insensitively. These are the Calendars `get_all_events()` defaults to.
Primary = primary
; Dweeb Family = <id>@group.calendar.google.com
